# Font Configuration
font_family      ZedMono Nerd Font Expanded Medium
font_size        17.0



# Performance
# Kitty uses GPU acceleration by default

# Additional recommended settings
enable_audio_bell       no

# Tab Configuration
# New tabs open in the same directory as the current tab
map cmd+t new_tab_with_cwd


# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$nix_shell\
$git_branch\
$git_status\
$gcloud\
$pulumi\
$fill\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$conda\
$docker_context\
$python\
$time\n  \
[󱞪](fg:purple) \
"""
palette = 'rose-pine'



[palettes.rose-pine]
background = "#191724"
lighter_background = "#1f1d2e"
red = "#eb6f92"
green = "#9ccfd8"
yellow = "#f6c177"
blue = "#31748f"
magenta = "#c4a7e7"
cyan = "#9ccfd8"
light_gray = "#908caa"
foreground = "#e0def4"
purple = "#c4a7e7"
pink = "#eb6f92"

[directory]
format = "[](fg:lighter_background)[ $path ]($style)[](fg:lighter_background) "
style = "bg:lighter_background fg:blue"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:lighter_background"
symbol = " "

[nix_shell]
format = "[](fg:lighter_background)[$symbol $name]($style)[](fg:lighter_background) "
style = "bg:lighter_background fg:cyan"
symbol = " "

[git_branch]
format = "[](fg:lighter_background)[ $symbol $branch ]($style)[](fg:lighter_background) "
style = "bg:lighter_background fg:cyan"
symbol = ""

[git_status]
disabled = false
style = "bg:lighter_background fg:red"
format = '[](fg:lighter_background)([🐢 ($all_status)($ahead_behind)]($style))[](fg:lighter_background) '
up_to_date = '[✓ ](bg:lighter_background fg:purple)'
untracked = '[?\($count\)](bg:lighter_background fg:yellow)'
stashed = '[\$](bg:lighter_background fg:purple)'
modified = '[!\($count\)](bg:lighter_background fg:yellow)'
renamed = '[»\($count\)](bg:lighter_background fg:purple)'
deleted = '[✘\($count\)](style)'
staged = '[++\($count\)](bg:lighter_background fg:yellow)'
ahead = '[⇡\(${count}\)](bg:lighter_background fg:cyan)'
diverged = '⇕[\[](bg:lighter_background fg:purple)[⇡\(${ahead_count}\)](bg:lighter_background fg:cyan)[⇣\(${behind_count}\)](bg:lighter_background fg:pink)[\]](bg:lighter_background fg:purple)'
behind = '[⇣\(${count}\)](bg:lighter_background fg:pink)'


[time]
disabled = false
time_format = "%a %e %b %R"
style = "bg:lighter_background fg:purple"
format = "[](fg:lighter_background)[ $time ]($style)[](fg:lighter_background)"

[username]
disabled = false
format = "[](fg:lighter_background)[ 󰇥 $user ]($style)[](fg:lighter_background) "
show_always = true
style_root = "bg:lighter_background fg:purple"
style_user = "bg:lighter_background fg:purple"

[gcloud]
style = "bg:lighter_background fg:cyan"
format = "[](fg:lighter_background)[$symbol$account]($style)[](fg:lighter_background) "
disabled = false
symbol = "󱇶 "

[pulumi]
style = "bg:lighter_background fg:purple"
format = "[](fg:lighter_background)[$symbol$stack]($style)[](fg:lighter_background) "
disabled = false
symbol = "  "
